<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match Madness</title>
<style>
  :root {
    --bg-deep: #0a0e27;
    --bg-mid: #1a1f4e;
    --panel: rgba(10, 14, 39, 0.92);
    --accent: #ff8ad6;
    --accent-2: #b46cff;
    --gold: #ffd95b;
    --good: #6ee7b7;
    --warn: #ff5b6e;
    --text: #f0f4ff;
    --muted: rgba(240, 244, 255, 0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: radial-gradient(ellipse at top, var(--bg-mid) 0%, var(--bg-deep) 55%, #05080d 100%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  /* Top stats bar (gameplay) */
  .stats-bar {
    position: fixed; top: 14px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 9;
    background: rgba(10,14,39,0.7);
    padding: 8px 16px; border-radius: 12px;
    border: 1px solid rgba(255,138,214,0.4);
    backdrop-filter: blur(6px);
  }
  .stat { text-align: center; min-width: 60px; }
  .stat .label { font-size: 0.6em; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 1.2em; color: var(--gold); font-weight: 800; line-height: 1.1; }

  /* Hub button */
  .hub-link {
    position: fixed; top: 14px; right: 14px; z-index: 11;
    display: inline-block; padding: 8px 14px;
    background: rgba(10,14,39,0.85); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px;
    font-size: 0.88em; font-weight: 700; letter-spacing: 1px;
    text-decoration: none; cursor: pointer;
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }
  .hub-link:hover { background: var(--accent); color: #0a0e27; transform: scale(1.06); }

  /* Panels */
  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 20;
  }
  .panel {
    pointer-events: auto;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 138, 214, 0.4);
    max-width: 92%;
    max-height: 92vh;
    overflow-y: auto;
  }
  .panel h1 { font-size: 2.2em; color: var(--accent); margin-bottom: 8px; letter-spacing: 1px; }
  .panel h2 { font-size: 1.4em; color: var(--gold); margin-bottom: 12px; }
  .panel h3 { font-size: 1em; color: var(--gold); margin: 14px 0 6px; }
  .panel p { margin: 6px 0; line-height: 1.5; opacity: 0.92; }
  .btn {
    display: inline-block; margin: 5px 4px;
    padding: 10px 20px;
    background: var(--accent); color: var(--bg-deep);
    border: none; border-radius: 8px;
    font-size: 1em; font-weight: 700;
    cursor: pointer; transition: transform 0.1s, background 0.1s;
    letter-spacing: 0.5px;
  }
  .btn:hover { transform: scale(1.06); background: var(--accent-2); color: white; }
  .btn.selected { background: var(--accent-2); color: white; }
  .btn.go { padding: 12px 32px; font-size: 1.15em; margin-top: 14px; background: var(--gold); color: #4d2d00; }
  .btn.go:hover { background: var(--good); }
  .btn.home {
    position: fixed; top: 14px; left: 14px; z-index: 11;
    margin: 0; padding: 8px 14px;
    background: rgba(10,14,39,0.85); color: var(--gold);
    border: 1px solid var(--gold); border-radius: 8px;
    font-size: 0.88em; font-weight: 700; letter-spacing: 1px;
  }
  .btn.home:hover { background: var(--gold); color: #0a0e27; transform: scale(1.06); }
  .small { font-size: 0.85em; opacity: 0.75; }
  .hidden { display: none !important; }

  /* Card grid */
  .board {
    display: grid;
    gap: 10px;
    perspective: 1000px;
    margin-top: 60px;
  }
  .board.easy {
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: min(92vw, calc((82vh - 80px) * 4 / 3));
    aspect-ratio: 4 / 3;
  }
  .board.medium {
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    width: min(92vw, calc(82vh - 80px));
    aspect-ratio: 1 / 1;
  }
  .board.hard {
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    width: min(94vw, calc((82vh - 80px) * 3 / 2));
    aspect-ratio: 3 / 2;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.matched { transform: rotateY(180deg) scale(0.95); cursor: default; }
  .card.matched .face-front {
    box-shadow: 0 0 22px var(--good), 0 0 40px rgba(110,231,183,0.4);
    border-color: var(--good);
    background: linear-gradient(135deg, rgba(110,231,183,0.95) 0%, rgba(255,217,91,0.95) 100%);
  }
  .match-face {
    display: inline-block;
    animation: matchPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes matchPop {
    0%   { transform: scale(0.2) rotate(-180deg); opacity: 0; }
    60%  { transform: scale(1.35) rotate(15deg);  opacity: 1; }
    100% { transform: scale(1)    rotate(0deg);   opacity: 1; }
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.4em, 4.5vw, 2.6em);
    font-weight: 800;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: box-shadow 0.3s, border-color 0.3s;
  }
  .face-back {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: white;
    border: 2px solid rgba(255,255,255,0.25);
  }
  .face-back::after {
    content: '?';
    color: white;
    text-shadow: 0 0 12px rgba(255,255,255,0.6);
  }
  .face-front {
    background: linear-gradient(135deg, rgba(255,217,91,0.95) 0%, rgba(255,138,214,0.95) 100%);
    color: var(--bg-deep);
    border: 2px solid var(--gold);
    transform: rotateY(180deg);
  }

  /* Confetti for win */
  .confetti {
    position: fixed; top: -10px; width: 8px; height: 14px;
    z-index: 30; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  @media (max-width: 600px) {
    .panel { padding: 22px 22px; }
    .panel h1 { font-size: 1.7em; }
    .stats-bar { gap: 8px; padding: 6px 12px; }
    .stat .value { font-size: 1em; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="board hidden" id="board"></div>
</div>

<button class="btn home hidden" id="homeBtn">🏠 MENU</button>
<a href="../" class="hub-link" title="Back to Game Hub">◀ HUB</a>

<div class="stats-bar hidden" id="statsBar">
  <div class="stat"><div class="label">Moves</div><div class="value" id="movesV">0</div></div>
  <div class="stat"><div class="label">Time</div><div class="value" id="timeV">0:00</div></div>
  <div class="stat"><div class="label">Pairs</div><div class="value" id="pairsV">0/0</div></div>
  <div class="stat"><div class="label">Best</div><div class="value" id="bestV">—</div></div>
</div>

<div id="overlay">
  <!-- START PANEL -->
  <div class="panel" id="startPanel">
    <h1>🎴 MATCH MADNESS</h1>
    <p>Flip cards two at a time. Find every matching pair to win.</p>
    <h3>THEME</h3>
    <div id="themeBtns">
      <button class="btn selected" data-theme="animals">🐾 Animals</button>
      <button class="btn" data-theme="fruits">🍎 Fruits</button>
      <button class="btn" data-theme="planets">🪐 Space</button>
      <button class="btn" data-theme="emoji">😄 Faces</button>
    </div>
    <h3>DIFFICULTY</h3>
    <div id="diffBtns">
      <button class="btn" data-diff="easy">EASY · 6 pairs</button>
      <button class="btn selected" data-diff="medium">MEDIUM · 8 pairs</button>
      <button class="btn" data-diff="hard">HARD · 12 pairs</button>
    </div>
    <br>
    <button class="btn go" id="startBtn">▶ START</button>
    <p class="small" style="margin-top:14px;">Fewer moves = higher score. Best score saved per theme &amp; difficulty.</p>
  </div>

  <!-- WIN PANEL -->
  <div class="panel hidden" id="winPanel">
    <h1>🎉 YOU WON!</h1>
    <p style="font-size:1.15em; margin: 8px 0 14px;">All pairs matched.</p>
    <div style="display:flex; justify-content:center; gap:20px; margin: 16px 0; flex-wrap:wrap;">
      <div><div class="small">Moves</div><div style="font-size:1.6em; color:var(--gold); font-weight:800;" id="winMoves">—</div></div>
      <div><div class="small">Time</div><div style="font-size:1.6em; color:var(--gold); font-weight:800;" id="winTime">—</div></div>
      <div><div class="small">Score</div><div style="font-size:1.6em; color:var(--accent); font-weight:800;" id="winScore">—</div></div>
    </div>
    <p id="bestNote" class="small"></p>
    <br>
    <button class="btn go" id="playAgainBtn">▶ PLAY AGAIN</button>
    <button class="btn" id="menuBtn">MENU</button>
  </div>
</div>

<script>
"use strict";

const THEMES = {
  animals: ['🐶','🐱','🦊','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🦋','🐝'],
  fruits:  ['🍎','🍌','🍇','🍉','🍓','🍑','🍍','🥝','🍒','🥭','🍋','🍐'],
  planets: ['☀️','🌍','🌙','⭐','🪐','💫','☄️','🌠','🌌','🚀','🛰️','👽'],
  emoji:   ['😀','😎','🤩','🥳','😂','🤪','🤔','😴','🤖','👻','🎃','🦄']
};
const FUNNY_FACES = [
  '🤪','😜','🤩','🥳','😎','🤓','🥸','🤡','😂','🤣',
  '😋','🥰','😇','🤠','👽','🤖','🐵','🙃','😝','🥴',
  '🤯','🥺','😏','🤗','🦄','👻','🎃','💩','😈','🤘'
];
const DIFFS = {
  easy:   { pairs: 6,  className: 'easy'   },
  medium: { pairs: 8,  className: 'medium' },
  hard:   { pairs: 12, className: 'hard'   }
};

const $ = (id) => document.getElementById(id);

const state = {
  theme: 'animals',
  diff: 'medium',
  cards: [],          // { sym, matched, flipped }
  flippedIdx: [],     // indices of currently face-up unmatched cards
  busy: false,
  moves: 0,
  matched: 0,
  pairs: 0,
  startTime: 0,
  timerId: null
};

/* ---------- UI bindings ---------- */
document.querySelectorAll('#themeBtns .btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#themeBtns .btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    state.theme = b.dataset.theme;
  });
});
document.querySelectorAll('#diffBtns .btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#diffBtns .btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    state.diff = b.dataset.diff;
  });
});
$('startBtn').addEventListener('click', startGame);
$('playAgainBtn').addEventListener('click', () => { hide('winPanel'); startGame(); });
$('menuBtn').addEventListener('click', goMenu);
$('homeBtn').addEventListener('click', goMenu);

/* ---------- helpers ---------- */
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function bestKey(){ return `match_best_${state.theme}_${state.diff}`; }
function getBest(){
  try { const v = localStorage.getItem(bestKey()); return v ? JSON.parse(v) : null; } catch(e){ return null; }
}
function setBest(b){ try { localStorage.setItem(bestKey(), JSON.stringify(b)); } catch(e){} }

/* ---------- start / setup ---------- */
function startGame(){
  const cfg = DIFFS[state.diff];
  state.pairs = cfg.pairs;
  state.matched = 0;
  state.moves = 0;
  state.flippedIdx = [];
  state.busy = false;

  const symbols = shuffle(THEMES[state.theme].slice()).slice(0, cfg.pairs);
  const deck = shuffle([...symbols, ...symbols]);
  state.cards = deck.map(sym => ({ sym, matched: false, flipped: false }));

  buildBoard(cfg.className);
  state.startTime = Date.now();
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(tick, 200);

  $('movesV').textContent = '0';
  $('timeV').textContent = '0:00';
  $('pairsV').textContent = `0/${state.pairs}`;
  const best = getBest();
  $('bestV').textContent = best ? best.score : '—';

  hide('startPanel');
  hide('winPanel');
  show('statsBar');
  show('board');
  show('homeBtn');
}

function buildBoard(klass){
  const board = $('board');
  board.className = 'board ' + klass;
  board.innerHTML = '';
  state.cards.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = i;
    card.innerHTML = `<div class="face face-back"></div><div class="face face-front">${c.sym}</div>`;
    card.addEventListener('click', () => onCardClick(i));
    board.appendChild(card);
  });
}

function onCardClick(i){
  if (state.busy) return;
  const card = state.cards[i];
  if (card.matched || card.flipped) return;
  flipCard(i, true);
  state.flippedIdx.push(i);
  if (state.flippedIdx.length === 2){
    state.busy = true;
    state.moves += 1;
    $('movesV').textContent = state.moves;
    setTimeout(checkMatch, 700);
  }
}

function flipCard(i, on){
  state.cards[i].flipped = on;
  const el = document.querySelector(`.card[data-idx="${i}"]`);
  if (!el) return;
  el.classList.toggle('flipped', on);
}

function checkMatch(){
  const [a, b] = state.flippedIdx;
  if (state.cards[a].sym === state.cards[b].sym){
    state.cards[a].matched = true;
    state.cards[b].matched = true;
    const cardA = document.querySelector(`.card[data-idx="${a}"]`);
    const cardB = document.querySelector(`.card[data-idx="${b}"]`);
    cardA.classList.add('matched');
    cardB.classList.add('matched');
    // Transform both into the same random funny face
    const face = FUNNY_FACES[Math.floor(Math.random() * FUNNY_FACES.length)];
    const frontA = cardA.querySelector('.face-front');
    const frontB = cardB.querySelector('.face-front');
    frontA.innerHTML = `<span class="match-face">${face}</span>`;
    frontB.innerHTML = `<span class="match-face">${face}</span>`;
    state.matched += 1;
    $('pairsV').textContent = `${state.matched}/${state.pairs}`;
    if (state.matched === state.pairs){
      win();
    }
  } else {
    flipCard(a, false);
    flipCard(b, false);
  }
  state.flippedIdx = [];
  state.busy = false;
}

function tick(){
  $('timeV').textContent = fmtTime(Date.now() - state.startTime);
}

function win(){
  clearInterval(state.timerId);
  const elapsed = Date.now() - state.startTime;
  const seconds = Math.floor(elapsed / 1000);
  // score: more pairs + fewer moves + faster = higher
  const optimalMoves = state.pairs;
  const moveBonus = Math.max(0, 1000 - (state.moves - optimalMoves) * 30);
  const timeBonus = Math.max(0, 800 - seconds * 2);
  const score = Math.round(state.pairs * 100 + moveBonus + timeBonus);

  $('winMoves').textContent = state.moves;
  $('winTime').textContent = fmtTime(elapsed);
  $('winScore').textContent = score;

  const prev = getBest();
  let note = '';
  if (!prev || score > prev.score){
    setBest({ score, moves: state.moves, time: elapsed });
    note = '⭐ NEW BEST! ⭐';
  } else {
    note = `Best so far: ${prev.score} (${prev.moves} moves)`;
  }
  $('bestNote').textContent = note;

  // confetti
  for (let i = 0; i < 60; i++) spawnConfetti();

  setTimeout(() => {
    hide('statsBar');
    hide('board');
    hide('homeBtn');
    show('winPanel');
  }, 700);
}

function goMenu(){
  if (state.timerId) clearInterval(state.timerId);
  hide('winPanel');
  hide('statsBar');
  hide('board');
  hide('homeBtn');
  show('startPanel');
}

function spawnConfetti(){
  const c = document.createElement('div');
  c.className = 'confetti';
  c.style.left = Math.random()*100 + 'vw';
  c.style.background = ['#ff8ad6','#ffd95b','#6ee7b7','#b46cff','#4ee2ec'][Math.floor(Math.random()*5)];
  c.style.animationDuration = (1.4 + Math.random()*1.6) + 's';
  c.style.animationDelay = (Math.random()*0.3) + 's';
  c.style.transform = `rotate(${Math.random()*360}deg)`;
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 3500);
}
</script>
</body>
</html>
